<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Infra integration fixture</title>
</head>
<body>
<!--
  Scratch page for tests/infra/integration.test.js. Not part of the site: it loads every infra
  module in the page builders' order and gives YSD.feed.attach() the smallest markup the feed
  contract allows. The test drives everything else from Playwright. No inline scripts (the site
  CSP is script-src 'self'); the inline styles only give the feed a scroll box to observe.
-->
<main id="app">
  <h1>Infra integration fixture</h1>
  <div id="feed" style="height:480px;overflow-y:auto">
    <article data-feed-item data-clip-id="demo-mail-ballot-renew" style="height:480px">
      <video data-src="assets/video/mail-ballot-renew.mp4" data-poster="assets/video/mail-ballot-renew.jpg" aria-label="Demo clip one" style="height:400px"></video>
      <button type="button" data-feed-like aria-pressed="false">Like <span data-feed-likes>0</span></button>
      <button type="button" data-feed-mute aria-pressed="true">Sound</button>
    </article>
    <article data-feed-item data-clip-id="demo-sunrail-rally" style="height:480px">
      <video data-src="assets/video/sunrail-rally.mp4" data-poster="assets/video/sunrail-rally.jpg" aria-label="Demo clip two" style="height:400px"></video>
      <button type="button" data-feed-like aria-pressed="false">Like <span data-feed-likes>0</span></button>
      <button type="button" data-feed-mute aria-pressed="true">Sound</button>
    </article>
  </div>
</main>
<script src="../../../assets/js/config.js"></script>
<script src="../../../assets/js/store.js"></script>
<script src="../../../data/counters.js"></script>
<script src="../../../assets/js/share.js"></script>
<script src="../../../assets/js/cal.js"></script>
<script src="../../../assets/js/cards.js"></script>
<script src="../../../assets/js/members.js"></script>
<script src="../../../assets/js/track.js"></script>
<script src="../../../data/clips.js"></script>
<script src="../../../assets/js/clips.js"></script>
<script src="../../../assets/js/feed.js"></script>
<script src="../../../assets/js/sw-register.js"></script>
</body>
</html>
